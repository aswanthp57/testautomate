apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-service-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: test-service-app

  template:
    metadata:
      labels:
        app: test-service-app

    spec:
      containers:
        - name: test-service-app
          image: registryplatform.powermindinc.com/test-service-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: test-service-app
spec:
  selector:
    app: test-service-app

  ports:
    - protocol: TCP
      port: 8088
      targetPort: 80

  type: ClusterIP
